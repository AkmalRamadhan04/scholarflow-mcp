[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "scholarflow-mcp"
version = "0.1.0"
description = "Unified Academic Research & Reproducible SLR MCP Server + Agent Skill Bundle (SPAR-4-SLR, PRISMA 2020, ADO-TCM, Blinded Human Reliability, 4-Way Integrity Audit)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Akmal Ramadhan", email = "akmalramadhan2002@mail.ugm.ac.id" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "systematic-review",
    "spar-4-slr",
    "prisma",
    "academic-research",
    "reproducible-research",
    "inter-rater-reliability",
    "cohens-kappa",
    "agent-skills",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=1.2.0",
    "openpyxl>=3.1.2",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "matplotlib>=3.9.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.scripts]
scholarflow-mcp = "scholarflow_mcp.server:main"

[project.urls]
Homepage = "https://github.com/AkmalRamadhan04/scholarflow-mcp"
Repository = "https://github.com/AkmalRamadhan04/scholarflow-mcp"
Issues = "https://github.com/AkmalRamadhan04/scholarflow-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/scholarflow_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
